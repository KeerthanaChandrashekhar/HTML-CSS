<!DOCTYPE html>
<html>
<head>
  <title>Position practice</title>
</head>
<body style="
  height: 3000px;
  padding-top: 60px;
  padding-left: 80px;
  ">
  <div style="
  background-color: black;
  color: white;
  position: fixed;
  top: 0px;
  left: 0px;
  right: 0px;
  height:50px;
  z-index: 1;
">header</div>

<div style="
background-color: green;
color: white;
position: fixed;
left: 0;
bottom: 0;
top: 50px;
width: 72px;
">
  Sidebar
  <div style="
  position: absolute;
  background-color: red;
  color: white;
  right: 0px;
  top: 0px;
  z-index: 2;
  ">
  X
</div>
</div>

<div style="
  position: absolute;
  background-color: red;
  color: white;
  right: 10px;
  top: 60px;
  z-index: 2;
  ">
  absolute
</div>

  <div style="
  background-color: lightblue;
  width: 200px;
  height: 200px;
  position: static;
  
  ">div1</div>
  <div style="
  background-color: lightpink;
  width: 200px;
  height: 200px;
  position: relative;
  ">div2
  <div style="
    position: absolute;
    background-color: black;
    color: white;
    bottom: 10px;
    right: 10px;                         
    z-index: 0;
    ">
    5:00
  </div>
</div>
</body>
</html>
